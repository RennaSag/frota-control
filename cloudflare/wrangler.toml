name = "controle-frota"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api.php", "/manifest.php", "/", "/index.php", "/index.html"]
html_handling = "none"

[placement]
mode = "smart"

[observability]
enabled = true

[vars]
FROTA_PUSH_CONTATO = "mailto:contato@controle-frota.app"
# Configuração usada pelo `wrangler preview` (deploys de prévia por branch).
[previews.vars]
FROTA_PUSH_CONTATO = "mailto:contato@controle-frota.app"

[previews.placement]
mode = "smart"

# Configure DATABASE_URL e FROTA_ADMIN_SENHA com wrangler secret put.
# A prévia PHP e o SQLite locais continuam independentes desta configuração.
